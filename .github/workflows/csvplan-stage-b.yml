name: csvplan Stage B audit

on:
  push:
    branches: [csvplan-faithful-work]
  workflow_dispatch:

jobs:
  stage-b:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run one-factor Stage B audit
        run: python scripts/run_csvplan_stage_b.py

      - name: Run csvplan tests
        run: python -m unittest discover -s tests -v

      - uses: actions/upload-artifact@v4
        with:
          name: csvplan-stage-b-audit
          path: comparison/stage_b/
          if-no-files-found: error
