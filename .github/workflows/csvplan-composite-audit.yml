name: csvplan composite audit

on:
  push:
    branches: [csvplan-faithful-work]
  workflow_dispatch:

jobs:
  composite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Run staged composite audit
        run: python scripts/run_csvplan_composite_audit.py
      - name: Run csvplan tests
        run: python -m unittest discover -s tests -v
      - uses: actions/upload-artifact@v4
        with:
          name: csvplan-composite-audit
          path: comparison/composite/
          if-no-files-found: error
