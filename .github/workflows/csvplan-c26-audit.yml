name: csvplan C26 capital update audit

on:
  push:
    branches: [csvplan-faithful-work]
  workflow_dispatch:

jobs:
  c26:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Run C26 audit
        run: python scripts/run_csvplan_c26_audit.py
      - name: Run csvplan tests
        run: python -m unittest discover -s tests -v
      - uses: actions/upload-artifact@v4
        with:
          name: csvplan-c26-audit
          path: comparison/c26/
          if-no-files-found: error
