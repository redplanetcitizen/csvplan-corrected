name: csvplan depreciation timing audit

on:
  push:
    branches: [csvplan-faithful-work]
  workflow_dispatch:

jobs:
  depreciation-timing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Run depreciation timing audit
        run: python scripts/run_csvplan_depreciation_timing.py
      - name: Run csvplan tests
        run: python -m unittest discover -s tests -v
      - uses: actions/upload-artifact@v4
        with:
          name: csvplan-depreciation-timing-audit
          path: comparison/depreciation_timing/
          if-no-files-found: error
