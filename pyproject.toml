[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "csvplan-corrected"
version = "1.0.0"
description = "Standalone corrected New Harmony csvplan solver with a persistent terminal navigator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
]

[project.scripts]
csvplan-corrected = "csvplan_corrected.cli:main"

[tool.setuptools]
packages = ["csvplan_corrected"]
include-package-data = true

[tool.setuptools.package-data]
csvplan_corrected = ["data/*.csv"]
